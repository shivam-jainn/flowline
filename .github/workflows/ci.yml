name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, x86_64-pc-windows-msvc

      - name: Install uniffi-bindgen + wasm-pack
        run: |
          cargo install uniffi --features cli --locked || true
          cargo install wasm-pack --locked || true

      - name: Rust FFI artifacts
        run: tooling/toolchain/build-rust-ffi.sh

      - name: Swift build + test
        run: |
          swift build
          swift test

      - name: Architecture gate
        run: tooling/ci/check_architecture.sh

      - name: Rust tests + clippy
        run: tooling/ci/check_rust.sh

      - name: Windows cross-compile check
        run: cargo check --manifest-path Rust/Cargo.toml -p flowline_win_capture --target x86_64-pc-windows-msvc

      - name: WASM gate
        run: tooling/ci/check_wasm.sh
